# ============================================================
# Data Quality Rules - Stage 2
# ============================================================

version: 2

# ============================================================
# ACCOUNTS TABLE
# ============================================================
accounts:
  null_checks:
    - column: account_id
      action: QUARANTINE
      dq_code: EXCLUDED_NULL_PK
    - column: customer_id
      action: FLAG
      dq_code: NULL_REQUIRED

  duplicate_checks:
    keys: [account_id]
    keep: first
    dq_code: DUPLICATE_ACCOUNT

  type_checks:
    credit_limit:
      expected_type: decimal
      action: CORRECT
    current_balance:
      expected_type: decimal
      action: CORRECT

  date_format_checks:
    - column: open_date
      formats: ["yyyy-MM-dd", "dd/MM/yyyy"]
      dq_code: DATE_FORMAT
    - column: last_activity_date
      formats: ["yyyy-MM-dd", "dd/MM/yyyy"]
      dq_code: DATE_FORMAT

# ============================================================
# CUSTOMERS TABLE
# ============================================================
customers:
  null_checks:
    - column: customer_id
      action: QUARANTINE
      dq_code: EXCLUDED_NULL_PK

  duplicate_checks:
    keys: [customer_id]
    keep: first
    dq_code: DUPLICATE_CUSTOMER

  type_checks:
    risk_score:
      expected_type: integer
      action: CORRECT

  date_format_checks:
    - column: dob
      formats: ["yyyy-MM-dd", "dd/MM/yyyy"]
      dq_code: DATE_FORMAT

  domain_checks:
    - column: gender
      allowed: ["M", "F"]
      dq_code: INVALID_VALUE

# ============================================================
# TRANSACTIONS TABLE
# ============================================================
transactions:
  duplicate_checks:
    keys: [transaction_id]
    keep: latest
    dq_code: DUPLICATE_DEDUPED

  orphaned_checks:
    column: account_id
    reference_table: accounts
    reference_column: account_id
    action: FLAG
    dq_code: ORPHANED_ACCOUNT

  null_checks:
    - column: transaction_id
      action: QUARANTINE
      dq_code: NULL_REQUIRED
    - column: amount
      action: FLAG
      dq_code: NULL_REQUIRED

  type_checks:
    amount:
      expected_type: decimal
      action: CORRECT
      dq_code: TYPE_MISMATCH

  date_format_checks:
    - column: transaction_date
      formats: ["yyyy-MM-dd", "dd/MM/yyyy", "MM/dd/yyyy"]
      dq_code: DATE_FORMAT

  currency_normalization:
    column: currency
    target: "ZAR"
    variants: ["R", "rands", "710", "zar", "Zar"]
    dq_code: CURRENCY_VARIANT

# ============================================================
# SCHEMA EVOLUTION (Stage 2)
# ============================================================
schema_evolution:
  transactions:
    - column: merchant_subcategory
      nullable: true
      default: null